<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Órdenes — Taller Motos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- SIDEBAR DESKTOP -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text">GyverMotos</div>
      <div class="sidebar-logo-sub">Sistema de gestión</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-label">Principal</div>
    <a class="nav-link nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a class="nav-link nav-item active" href="/ordenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Órdenes
    </a>
    <a class="nav-link nav-item" href="/clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes
    </a>
    <a class="nav-link nav-item" href="/motos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M4.5 17H2v-4l4-6h8l2 5h3.5"/><path d="M11 11V6"/></svg>
      Motos
    </a>
    <div class="sidebar-nav-divider"></div>
    <div class="sidebar-nav-label">Administración</div>
    <a class="nav-link nav-item" href="/usuarios" data-require-role="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Usuarios
    </a>
  </nav>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar" id="sidebarAvatar">--</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarUserName"></div>
      <div class="sidebar-user-role" id="sidebarUserRole"></div>
    </div>
  </div>
</aside>
<div class="main-wrapper">

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Órdenes de Trabajo</h1>
    <button class="btn btn-primary" id="btnNuevaOT" data-require-role="admin,recepcion">+ Nueva Orden</button>
  </div>

  <div class="search-bar">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" type="search" id="searchQ" placeholder="Buscar patente, cliente, número...">
  </div>

  <div class="chips" id="chipsEstado">
    <button class="chip active" data-estado="">Todas</button>
    <button class="chip" data-estado="recibida">Recibidas</button>
    <button class="chip" data-estado="en_reparacion">En reparación</button>
    <button class="chip" data-estado="entregada">Entregadas</button>
  </div>

  <p class="results-label" id="resultsLabel"></p>

  <div id="listaOrdenes">
    <div class="empty-state"><div class="empty-icon">🔄</div><p>Cargando...</p></div>
  </div>
</div>

<!-- FAB móvil -->
<button class="fab" id="btnNuevaOTFab" aria-label="Nueva Orden" data-require-role="admin,recepcion">+</button>

<!-- Modal Nueva OT (wizard) -->
<div class="modal hidden" id="modalNuevaOT">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="wizardTitle">Nueva Orden</h2>
      <button class="modal-close" onclick="App.closeModal('modalNuevaOT')">✕</button>
    </div>

    <div class="wizard-steps" id="wizardDots"></div>
    <div class="summary-card hidden" id="wizardResumen"></div>

    <!-- Paso 1: Patente -->
    <div id="wizardStep1" class="wizard-panel">
      <div class="form-group">
        <label class="form-label required">Patente</label>
        <input type="text" id="inputPatente" class="input-uppercase"
               placeholder="Ej: ABC123"
               style="font-size:1.25rem; text-align:center; letter-spacing:6px; font-weight:800; height:56px">
        <div class="text-muted mt-1" id="patenteStatus" style="font-size:0.8125rem"></div>
      </div>
      <div id="motoEncontrada" class="hidden">
        <div style="padding:14px 16px; background:#F0FDF4; border:1.5px solid #A7F3D0; border-radius:12px">
          <div style="font-weight:700; font-size:0.9375rem" id="motoEncontradaTitle"></div>
          <div class="text-muted text-sm" style="margin-top:3px" id="motoEncontradaMeta"></div>
        </div>
      </div>
      <div id="motoNuevaAlert" class="hidden">
        <div style="background:#FFF4EE; border:1.5px solid #FED7AA; border-radius:12px; padding:14px 16px; font-size:0.875rem; color:#92400E; font-weight:500">
          Moto nueva — completá los datos en los siguientes pasos
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="App.closeModal('modalNuevaOT')">Cancelar</button>
        <button class="btn btn-primary" id="btnPaso1Siguiente">Siguiente →</button>
      </div>
    </div>

    <!-- Paso 2: Datos de la moto nueva -->
    <div id="wizardStep2" class="wizard-panel hidden">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Marca</label>
          <input type="text" id="newMotoMarca" class="input-uppercase" placeholder="HONDA, YAMAHA...">
        </div>
        <div class="form-group">
          <label class="form-label">Modelo</label>
          <input type="text" id="newMotoModelo" class="input-uppercase" placeholder="CB300, FZ...">
        </div>
        <div class="form-group">
          <label class="form-label">Color</label>
          <input type="text" id="newMotoColor" placeholder="Rojo, Negro...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnPaso2Atras">← Atrás</button>
        <button class="btn btn-primary" id="btnPaso2Siguiente">Siguiente →</button>
      </div>
    </div>

    <!-- Paso 3: Titular de la moto -->
    <div id="wizardStep3" class="wizard-panel hidden">
      <div class="form-group">
        <label class="form-label required">Titular de la moto</label>
        <div class="input-group">
          <input type="text" id="searchCliente" placeholder="Buscar por nombre o teléfono...">
          <button class="btn btn-secondary btn-sm" id="btnNuevoCliente">+ Nuevo</button>
        </div>
        <div id="clienteResults" class="hidden" style="border:1.5px solid var(--border); border-top:none; border-radius:0 0 10px 10px; background:#fff; max-height:160px; overflow-y:auto; box-shadow:var(--shadow-sm)"></div>
        <div id="clienteSeleccionado" class="hidden" style="margin-top:8px; padding:10px 14px; background:#F0FDF4; border:1.5px solid #A7F3D0; border-radius:10px; font-size:0.875rem; font-weight:600; color:#065F46"></div>
      </div>
      <div id="formNuevoCliente" class="hidden" style="border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-top:8px; background:var(--bg-subtle)">
        <div style="font-weight:700; font-size:0.875rem; margin-bottom:12px; color:var(--text-2)">Nuevo cliente</div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label required">Nombre</label>
            <input type="text" id="ncNombre" placeholder="Juan García">
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="tel" id="ncTelefono" placeholder="11 2345-6789">
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnGuardarNuevoCliente">Guardar cliente</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnPaso3Atras">← Atrás</button>
        <button class="btn btn-primary" id="btnPaso3Siguiente">Siguiente →</button>
      </div>
    </div>

    <!-- Paso 4: Datos del ingreso -->
    <div id="wizardStep4" class="wizard-panel hidden">
      <div class="form-group">
        <label class="form-label required">Problema declarado por el cliente</label>
        <textarea id="otProblema" class="textarea-list" placeholder="¿Qué le pasa a la moto según el cliente?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones internas</label>
        <textarea id="otObservaciones" class="textarea-list" placeholder="Notas que el cliente no verá..." style="min-height:64px"></textarea>
      </div>
      <div class="form-group">
        <span class="wz-section-title">Urgencia / Fecha prometida</span>
        <div class="urgency-list">
          <label class="urgency-btn">
            <input type="radio" name="otPrioridad" value="en_el_dia" hidden>
            <span class="urgency-dot" style="background:#EF4444"></span>
            <span class="urgency-label">En el día</span>
            <svg class="urgency-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </label>
          <label class="urgency-btn">
            <input type="radio" name="otPrioridad" value="manana" hidden>
            <span class="urgency-dot" style="background:#F97316"></span>
            <span class="urgency-label">Mañana</span>
            <svg class="urgency-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </label>
          <label class="urgency-btn">
            <input type="radio" name="otPrioridad" value="esta_semana" hidden>
            <span class="urgency-dot" style="background:#EAB308"></span>
            <span class="urgency-label">Esta semana</span>
            <svg class="urgency-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </label>
          <label class="urgency-btn">
            <input type="radio" name="otPrioridad" value="sin_apuro" hidden>
            <span class="urgency-dot" style="background:#22C55E"></span>
            <span class="urgency-label">Sin apuro</span>
            <svg class="urgency-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </label>
          <label class="urgency-btn">
            <input type="radio" name="otPrioridad" value="fecha_especifica" hidden>
            <span class="urgency-dot" style="background:#3B82F6"></span>
            <span class="urgency-label">Fecha específica</span>
            <svg class="urgency-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </label>
        </div>
        <div id="grupoPrioridadFecha" class="hidden" style="margin-top:10px">
          <input type="date" id="otFechaPrioridad">
        </div>
      </div>
      <div class="form-group">
        <label class="cedula-opcion" style="display:inline-flex; width:auto">
          <input type="checkbox" id="otFechaManual">
          <span>Ingresar fecha y hora de ingreso manualmente</span>
        </label>
        <div id="grupoFechaManual" class="hidden" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
          <input type="date" id="otFechaIngreso" style="flex:1; min-width:130px">
          <input type="time" id="otHoraIngreso" style="flex:1; min-width:100px">
        </div>
      </div>
      <div class="form-group">
        <span class="wz-section-title">Cédula presentada</span>
        <div class="cedula-row">
          <label class="cedula-btn" id="labelCedulaFisica">
            <input type="radio" name="otCedula" value="fisica" id="radioCedulaFisica" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/><line x1="14" y1="15" x2="18" y2="15"/></svg>
            Física
          </label>
          <label class="cedula-btn" id="labelCedulaDigital">
            <input type="radio" name="otCedula" value="digital" id="radioCedulaDigital" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
            Digital
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnPaso4Atras">← Atrás</button>
        <button class="btn btn-primary" id="btnCrearOT">Crear Orden</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/nueva-ot.js"></script>
<script src="/js/ordenes.js"></script>
<script>
  document.getElementById('btnNuevaOTFab')?.addEventListener('click', () => NuevaOT.abrir());
</script>
</div><!-- /main-wrapper -->
</body>
</html>
