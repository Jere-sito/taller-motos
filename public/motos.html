<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Motos — Taller Motos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- SIDEBAR DESKTOP -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text">GyverMotos</div>
      <div class="sidebar-logo-sub">Sistema de gestión</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-label">Principal</div>
    <a class="nav-link nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a class="nav-link nav-item" href="/ordenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Órdenes
    </a>
    <a class="nav-link nav-item" href="/clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes
    </a>
    <a class="nav-link nav-item active" href="/motos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M4.5 17H2v-4l4-6h8l2 5h3.5"/><path d="M11 11V6"/></svg>
      Motos
    </a>
    <div class="sidebar-nav-divider"></div>
    <div class="sidebar-nav-label">Administración</div>
    <a class="nav-link nav-item" href="/usuarios" data-require-role="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Usuarios
    </a>
  </nav>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar" id="sidebarAvatar">--</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarUserName"></div>
      <div class="sidebar-user-role" id="sidebarUserRole"></div>
    </div>
  </div>
</aside>
<div class="main-wrapper">

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Motos</h1>
  </div>
  <div class="search-bar">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" type="search" id="searchQ" placeholder="Buscar por patente, marca o dueño...">
  </div>
  <div class="chips" id="chipsMoto"></div>
  <p class="results-label" id="resultsLabelMotos"></p>
  <div id="listaMotos">
    <div class="empty-state"><div class="empty-icon">🔄</div><p>Cargando...</p></div>
  </div>
</div>

<div class="modal hidden" id="modalMoto">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="motoModalTitle">Editar moto</h2>
      <button class="modal-close" onclick="App.closeModal('modalMoto')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Patente</label>
      <input type="text" id="mPatente" readonly style="font-weight:800; letter-spacing:4px; text-align:center;">
    </div>
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Marca</label><input type="text" id="mMarca" placeholder="Honda"></div>
      <div class="form-group"><label class="form-label">Modelo</label><input type="text" id="mModelo" placeholder="CB300"></div>
      <div class="form-group"><label class="form-label">Color</label><input type="text" id="mColor" placeholder="Rojo"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Notas</label>
      <textarea id="mNotas" placeholder="Notas sobre la moto..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('modalMoto')">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarMoto">Guardar</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/motos.js"></script>
</div><!-- /main-wrapper -->
</body>
</html>
