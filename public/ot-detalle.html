<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>OT — Taller Motos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>

<!-- SIDEBAR DESKTOP -->
<aside class="sidebar no-print">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text">GyverMotos</div>
      <div class="sidebar-logo-sub">Sistema de gestión</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-label">Principal</div>
    <a class="nav-link nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a class="nav-link nav-item active" href="/ordenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Órdenes
    </a>
    <a class="nav-link nav-item" href="/clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes
    </a>
    <a class="nav-link nav-item" href="/motos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M4.5 17H2v-4l4-6h8l2 5h3.5"/><path d="M11 11V6"/></svg>
      Motos
    </a>
    <div class="sidebar-nav-divider"></div>
    <div class="sidebar-nav-label">Administración</div>
    <a class="nav-link nav-item" href="/usuarios" data-require-role="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Usuarios
    </a>
  </nav>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar" id="sidebarAvatar">--</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarUserName"></div>
      <div class="sidebar-user-role" id="sidebarUserRole"></div>
    </div>
  </div>
</aside>
<div class="main-wrapper">

<div class="page" id="paginaDetalle">
  <div class="empty-state"><div class="empty-icon">🔄</div><p>Cargando...</p></div>
</div>

<!-- Modal editar OT -->
<div class="modal hidden" id="modalEditarOT">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title">Editar orden</h2>
      <button class="modal-close" onclick="App.closeModal('modalEditarOT')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Apuro del cliente</label>
      <select id="editPrioridad">
        <option value="">— Sin especificar —</option>
        <option value="en_el_dia">En el día</option>
        <option value="manana">Mañana</option>
        <option value="esta_semana">Esta semana</option>
        <option value="sin_apuro">Sin apuro</option>
        <option value="fecha_especifica">Fecha específica</option>
      </select>
    </div>
    <div class="form-group" id="grupoEditProblema">
      <label class="form-label">Problema declarado</label>
      <textarea id="editProblema" class="textarea-list"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Observaciones internas</label>
      <textarea id="editObservaciones" class="textarea-list" style="min-height:72px"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Fecha prometida</label>
      <input type="date" id="editFechaPrometida">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('modalEditarOT')">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEdicion">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal agregar ítem -->
<div class="modal hidden" id="modalAgregarItem">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title">Agregar ítem</h2>
      <button class="modal-close" onclick="App.closeModal('modalAgregarItem')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label required">Tipo</label>
      <select id="itemTipo">
        <option value="repuesto">Repuesto</option>
        <option value="mano_obra">Mano de obra</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label required">Descripción</label>
      <input type="text" id="itemDescripcion" placeholder="Descripción del ítem">
    </div>
    <div class="grid-2">
      <div class="form-group" id="grupoCantidad">
        <label class="form-label">Cantidad</label>
        <input type="number" id="itemCantidad" value="1" min="0.01" step="0.01" inputmode="decimal">
      </div>
      <div class="form-group">
        <label class="form-label">Precio unitario ($)</label>
        <input type="text" id="itemPrecio" class="input-precio" inputmode="numeric" placeholder="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('modalAgregarItem')">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarItem">Agregar</button>
    </div>
  </div>
</div>

<!-- Modal registrar pago -->
<div class="modal hidden" id="modalPago">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title">Registrar pago</h2>
      <button class="modal-close" onclick="App.closeModal('modalPago')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label required">Medio de pago</label>
      <select id="pagoMedio">
        <option value="efectivo">Efectivo</option>
        <option value="mercadopago">Transferencia MercadoPago</option>
        <option value="puente">Transferencia Puente</option>
        <option value="credito">Tarjeta de crédito</option>
        <option value="debito">Tarjeta de débito</option>
      </select>
    </div>
    <div class="form-group hidden" id="grupoProveedor">
      <label class="form-label required">Proveedor destino</label>
      <input type="text" id="pagoProveedor" placeholder="Nombre del proveedor...">
    </div>
    <div class="form-group">
      <label class="form-label required">Monto ($)</label>
      <input type="text" id="pagoMonto" class="input-precio" inputmode="numeric" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">Notas</label>
      <input type="text" id="pagoNotas" placeholder="Opcional...">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeModal('modalPago')">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPago">Registrar</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ot-detalle.js"></script>
</div><!-- /main-wrapper -->
</body>
</html>
